name: validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill format and house style
        run: python3 scripts/validate_skills.py
      - name: Smoke-test the audit script (offline parse only)
        run: python3 -c "import ast; ast.parse(open('skills/seo-geo-audit/scripts/seo_audit.py').read())"
      - name: Smoke-test the page benchmark (offline parse only)
        run: python3 -c "import ast; ast.parse(open('skills/seo-geo-audit/scripts/page_benchmark.py').read())"
      - name: Smoke-test the site crawler and the decay finder (offline parse only)
        run: |
          python3 -c "import ast; ast.parse(open('skills/seo-internal-linking/scripts/site_crawl.py').read())"
          python3 -c "import ast; ast.parse(open('skills/seo-traffic-drop/scripts/content_decay.py').read())"
      - name: Smoke-test the rendering checker (offline parse only)
        run: python3 -c "import ast; ast.parse(open('skills/seo-ai-site-builders/scripts/render_check.py').read())"
      - name: Smoke-test the competitor sitemap reader and the data study builder (offline parse only)
        run: |
          python3 -c "import ast; ast.parse(open('skills/seo-competitor-analysis/scripts/competitor_sitemaps.py').read())"
          python3 -c "import ast; ast.parse(open('skills/seo-content-data-study/scripts/data_study.py').read())"
      - name: Smoke-test the Search Console differ (offline parse only)
        run: python3 -c "import ast; ast.parse(open('skills/seo-traffic-drop/scripts/gsc_diff.py').read())"
      - name: Smoke-test the comparison hub checker (offline parse only)
        run: python3 -c "import ast; ast.parse(open('skills/seo-content-comparison-hub/scripts/hub_check.py').read())"
