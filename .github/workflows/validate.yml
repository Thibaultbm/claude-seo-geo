name: validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill format and house style
        run: python3 scripts/validate_skills.py
      - name: Smoke-test the audit script (offline parse only)
        run: python3 -c "import ast; ast.parse(open('skills/seo-geo-audit/scripts/seo_audit.py').read())"
